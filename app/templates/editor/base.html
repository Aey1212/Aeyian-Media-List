<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Editor{% endblock %} · AML Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Oswald:wght@300..600&display=swap">
<link rel="stylesheet" href="{{ asset('aml.css') }}">
<link rel="stylesheet" href="{{ asset('editor.css') }}">
<link rel="icon" type="image/png" href="{{ asset('AML.png') }}">
</head>
<body class="ed">
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="{{ base }}/"><img class="brand-icon" src="{{ asset('AML.png') }}" alt="" width="30" height="30">AML Editor</a>
    <nav class="site-nav" aria-label="Editor">
      <a href="{{ base }}/">Search</a>
      <a href="{{ base }}/changes">Changes</a>
      <span class="ed-user">{{ user or ('local' if dev else '') }}</span>
    </nav>
  </div>
</header>
<main class="wrap">
{% block message %}{% if error %}<p class="ed-message ed-error" role="alert">{{ error }}</p>{% endif %}{% endblock %}
{% block content %}{% endblock %}
</main>
</body>
</html>
