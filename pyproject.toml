[project]
name = "aml"
version = "0.1.0"
description = "Aeyian Media List — server-rendered pages under /AML"
# The VPS runs Python 3.10, so nothing newer than 3.10 may be required.
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "psycopg[binary]>=3.2",
  "pillow>=10",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
